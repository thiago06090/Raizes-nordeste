# Nome da aplicação
spring.application.name=raizes-backend

# Banco H2 (em memória, para desenvolvimento)
spring.datasource.url=jdbc:h2:mem:raizesdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console do H2 (acessível pelo navegador)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# JWT (chave secreta - pode ser qualquer texto longo)
jwt.secret=raizes-nordeste-chave-secreta-super-longa-2026
jwt.expiration=86400000


